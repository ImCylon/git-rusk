[package]
name = "git-rusk"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Git hook manager with branch protection and TOTP verification"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
anyhow = "1.0"
thiserror = "2.0"
regex = "1.13"
include_dir = "0.7"
totp-rs = { version = "5.7", features = ["gen_secret", "zeroize", "otpauth"] }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
